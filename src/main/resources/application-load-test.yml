spring:
  config:
    activate:
      on-profile: load-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOAD_TEST_DB_URL:jdbc:mysql://127.0.0.1:3307/maru_egg_load_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true}
    username: ${LOAD_TEST_DB_USERNAME:loadtest}
    password: ${LOAD_TEST_DB_PASSWORD:loadtest}
    hikari:
      pool-name: maru-egg-load-test-pool
      minimum-idle: ${LOAD_TEST_HIKARI_MIN_IDLE:20}
      maximum-pool-size: ${LOAD_TEST_HIKARI_MAX_POOL_SIZE:20}
      connection-timeout: ${LOAD_TEST_HIKARI_CONNECTION_TIMEOUT_MS:1000}
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

web-client:
  base-url: ${LOAD_TEST_MOCK_URL:http://127.0.0.1:18080}

jwt:
  secretKey: load_test_secret_key_load_test_secret_key
  access:
    expiration: 3600000
    header: Authorization
  refresh:
    expiration: 1209600000
    header: Authorization-refresh

custom:
  swagger:
    key: local

server:
  port: ${LOAD_TEST_SERVER_PORT:8080}
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: ${LOAD_TEST_TOMCAT_MAX_THREADS:200}
      min-spare: 20
    accept-count: 4000
    max-connections: 8192

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: maru-egg-load-test
